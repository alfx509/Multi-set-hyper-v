name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Make a release with this tag, e.g. v0.3.0-test.1 (a dash = pre-release). Empty = just build.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the release step on v* tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check PowerShell scripts
        shell: powershell
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($_.Name):$($e.Extent.StartLineNumber) $($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Version
        id: version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          $tag = if ($env:RELEASE_INPUT) { $env:RELEASE_INPUT.Trim() } elseif ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { '' }
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Release tag must look like v1.2.3 or v1.2.3-test.1 (got '$tag')" }
          $v = if ($tag) { $tag.TrimStart('v') } else { "0.3.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build, test and make the installer
        shell: powershell
        run: .\build.ps1 -Installer -Version ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: MultiSeat-Setup-${{ steps.version.outputs.value }}
          path: out/installer/MultiSeat-Setup.exe

      - name: Publish release (v* tag, or "release" input of a manual run)
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/installer/MultiSeat-Setup.exe
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MultiSeat ${{ steps.version.outputs.tag }}
          # Tags with a dash (v0.3.0-test.1) are marked "Pre-release" = for testing.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download **MultiSeat-Setup.exe** below and run it.
               If Windows says "Windows protected your PC": **More info → Run anyway** (the installer is not signed yet).
            2. On Windows Server, tick **"Allow 4 to 8 players"** for more than 3 players.
            3. The PC restarts at the end.
            4. Open **MultiSeat** → **Add player** → **Assign devices** → **Start**.

            Windows Server: several people play at the same time. Windows 10/11 Pro: installs and runs,
            but Windows normally allows only one signed-in person at a time.
            Guide: https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/guide.md

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
