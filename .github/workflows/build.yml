name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/MultiSeat.Core.Tests -c Release

      - name: Publish
        run: |
          dotnet publish src/MultiSeat/MultiSeat.csproj -c Release -r win-x64 --self-contained true -o out/MultiSeat
          dotnet publish src/SeatAgent/SeatAgent.csproj -c Release -r win-x64 --self-contained true -o out/SeatAgent

      - name: Check PowerShell scripts
        shell: powershell
        run: |
          $bad = $false
          Get-ChildItem -Recurse -Include *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($_.Name):$($e.Extent.StartLineNumber) $($e.Message)"; $bad = $true }
          }
          if ($bad) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item -Recurse out pkg/out
          Copy-Item -Recurse setup pkg/setup
          Copy-Item README.md pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: MultiSeat
          path: pkg/
